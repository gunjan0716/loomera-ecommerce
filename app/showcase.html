<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
body{background:#1d211f;color:#fff;margin:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:110px}
.txt{max-width:520px}
.txt .eyebrow{color:#f0b796}
.txt h2{font-family:Fraunces,serif;font-weight:500;font-size:58px;line-height:1.04;letter-spacing:-.02em;margin:16px 0 18px}
.txt p{color:#b9c2bc;font-size:19px;margin:0 0 26px}
.txt ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.txt li{display:flex;gap:12px;align-items:center;color:#dfe4e0;font-size:17px}
.txt li b{width:28px;height:28px;border-radius:9px;background:#2c3430;display:grid;place-items:center;color:#9fc3ae;font-size:14px}
.phone{width:414px;height:868px;border-radius:56px;background:#0d0f0e;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 2px #3a403d inset}
.phone iframe{width:390px;height:844px;border:0;border-radius:44px;background:#faf7f2;display:block}
.notch{position:absolute;width:120px;height:30px;background:#0d0f0e;border-radius:20px;left:50%;transform:translateX(-50%);top:22px;z-index:3}
.pw{position:relative}
</style></head>
<body>
<div class="txt">
  <span class="eyebrow">Responsive by design</span>
  <h2>The same store,<br>built for phones.</h2>
  <p>Mobile-first layout with a bottom tab bar, swipeable categories and a full-screen bag.</p>
  <ul><li><b>✓</b>Touch-friendly product cards</li><li><b>✓</b>Sticky bottom navigation</li><li><b>✓</b>One-thumb checkout</li></ul>
</div>
<div class="pw"><div class="notch"></div><div class="phone"><iframe id="ph" src="index.html#/"></iframe></div></div>
</body></html>
